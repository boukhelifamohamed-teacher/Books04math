name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Build Android APK
        run: cordova build android --debug

      - name: Copy APK
        run: |
          mkdir -p build
          APK=$(find platforms/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" build/MathMiddle-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: math-middle-android
          path: build/MathMiddle-debug.apk
